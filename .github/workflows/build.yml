name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      # 用 Ninja + MSVC 环境，不写死 Visual Studio 生成器版本：
      # runner 镜像换版本时不会因为找不到某个 VS 实例而失败。
      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/TranslateCpp.exe dist
          Copy-Item config.example.json, README.md, LICENSE dist
          Compress-Archive -Path dist/* -DestinationPath TranslateCpp-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TranslateCpp-win64
          path: TranslateCpp-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TranslateCpp-win64.zip
