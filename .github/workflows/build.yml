name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S . -B build -G "Visual Studio 17 2022" -A x64

      - name: Build
        run: cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/TranslateCpp.exe dist
          Copy-Item config.example.json, README.md, LICENSE dist
          Compress-Archive -Path dist/* -DestinationPath TranslateCpp-win64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: TranslateCpp-win64
          path: TranslateCpp-win64.zip

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: TranslateCpp-win64.zip
